name: OpenWrt Manual IPK Build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build
        required: true
        default: all
        type: choice
        options:
          - all
          - aarch64
          - x86_64
          - arm_cortex-a7
      package:
        description: Package set to build
        required: true
        default: all
        type: choice
        options:
          - all
          - daemon
          - luci
      skip_ui_rebuild:
        description: Use the staged OpenWrt provider UI bundle instead of rebuilding inside build-ipk.sh
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: openwrt-ipk-manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-architectures:
    name: Select Architectures
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select matrix targets
        id: select
        run: |
          set -euo pipefail

          if [ "${{ inputs.package }}" = "luci" ]; then
            matrix='[{"name":"luci","rust_target":"","opkg_arch":""}]'
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ inputs.architecture }}" in
            all)
              matrix='[{"name":"aarch64","rust_target":"aarch64-unknown-linux-musl","opkg_arch":"aarch64_generic"},{"name":"x86_64","rust_target":"x86_64-unknown-linux-musl","opkg_arch":"x86_64"},{"name":"arm_cortex-a7","rust_target":"armv7-unknown-linux-musleabihf","opkg_arch":"arm_cortex-a7_neon-vfpv4"}]'
              ;;
            aarch64)
              matrix='[{"name":"aarch64","rust_target":"aarch64-unknown-linux-musl","opkg_arch":"aarch64_generic"}]'
              ;;
            x86_64)
              matrix='[{"name":"x86_64","rust_target":"x86_64-unknown-linux-musl","opkg_arch":"x86_64"}]'
              ;;
            arm_cortex-a7)
              matrix='[{"name":"arm_cortex-a7","rust_target":"armv7-unknown-linux-musleabihf","opkg_arch":"arm_cortex-a7_neon-vfpv4"}]'
              ;;
            *)
              echo "Unsupported architecture input: ${{ inputs.architecture }}" >&2
              exit 1
              ;;
          esac

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.name }}
    needs: select-architectures
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.select-architectures.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream --tags

      - name: Determine package version
        id: meta
        run: |
          set -euo pipefail

          version="$(git describe --tags --match 'v[0-9]*' --always --dirty)"
          package_release="$(sed -n 's/^PKG_RELEASE:=//p' openwrt/proxy-daemon/Makefile | head -n 1)"

          if [ -z "$version" ]; then
            echo "Unable to determine package version." >&2
            exit 1
          fi

          if [ -z "$package_release" ]; then
            echo "Unable to determine package release." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "package_release=$package_release"
            echo "package_version=$version-$package_release"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        if: ${{ inputs.package != 'luci' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Install cross
        if: ${{ inputs.package != 'luci' }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Cargo registry and build
        if: ${{ inputs.package != 'luci' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            proxy-daemon/target
          key: ${{ runner.os }}-cargo-${{ matrix.target.rust_target }}-${{ hashFiles('proxy-daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.rust_target }}-

      - name: Setup pnpm
        if: ${{ inputs.package != 'daemon' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: ${{ inputs.package != 'daemon' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: ${{ inputs.package != 'daemon' }}
        run: pnpm install --frozen-lockfile

      - name: Build OpenWrt provider UI bundle
        if: ${{ inputs.package != 'daemon' }}
        env:
          OPENWRT_LUCI_APP_VERSION: ${{ steps.meta.outputs.package_version }}
        run: pnpm build:openwrt-provider-ui

      - name: Build cc-switch binary
        if: ${{ inputs.package != 'luci' }}
        working-directory: proxy-daemon
        env:
          CCSWITCH_BUILD_VERSION: ${{ steps.meta.outputs.package_version }}
          CCSWITCH_PRODUCT_VERSION: ${{ steps.meta.outputs.version }}
        run: cross build --release --target ${{ matrix.target.rust_target }}

      - name: Install po2lmo
        if: ${{ inputs.package != 'daemon' }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openwrt/luci.git /tmp/luci
          cd /tmp/luci/modules/luci-base/src
          make po2lmo
          sudo cp po2lmo /usr/local/bin/

      - name: Build OpenWrt IPKs
        run: |
          set -euo pipefail

          args=(--package "${{ inputs.package }}")
          args+=(
            --version "${{ steps.meta.outputs.version }}"
            --release "${{ steps.meta.outputs.package_release }}"
          )

          if [ "${{ inputs.package }}" != "luci" ]; then
            args+=(
              --rust-target "${{ matrix.target.rust_target }}"
              --opkg-arch "${{ matrix.target.opkg_arch }}"
              --binary "proxy-daemon/target/${{ matrix.target.rust_target }}/release/cc-switch"
            )
          fi

          if [ "${{ inputs.skip_ui_rebuild }}" = "true" ] && [ "${{ inputs.package }}" != "daemon" ]; then
            CCSWITCH_IPK_SKIP_UI_REBUILD=1 openwrt/build-ipk.sh \
              "${args[@]}"
          else
            openwrt/build-ipk.sh \
              "${args[@]}"
          fi

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target.name }}
          path: |
            openwrt/dist/cc-switch_*_${{ matrix.target.opkg_arch }}.ipk
            openwrt/dist/luci-app-cc-switch_*.ipk
          if-no-files-found: error

  summary:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: build
    if: ${{ always() }}
    steps:
      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ipk-*
          path: artifacts

      - name: Write build summary
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find artifacts -type f -name '*.ipk' -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No IPK artifacts were downloaded." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## OpenWrt Manual IPK Build"
            echo
            echo "| Artifact | File | SHA256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${files[@]}"; do
            artifact_name="$(basename "$(dirname "$file")")"
            sha256="$(sha256sum "$file" | awk '{print $1}')"
            echo "| ${artifact_name} | $(basename "$file") | \`${sha256}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
