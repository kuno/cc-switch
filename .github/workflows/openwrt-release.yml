name: OpenWrt Release

on:
  push:
    tags:
      - "openwrt-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt release version, for example 3.14.1 or openwrt-v3.14.1"
        required: true
        type: string
      package_release:
        description: "OpenWrt package release number"
        required: true
        default: "1"
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: openwrt-release-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.version || '' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      package_release: ${{ steps.meta.outputs.package_release }}
      package_version: ${{ steps.meta.outputs.package_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_version="${{ inputs.version }}"
            package_release="${{ inputs.package_release }}"
            prerelease="${{ inputs.prerelease }}"
          else
            raw_version="${GITHUB_REF_NAME}"
            package_release="1"
            prerelease="false"
          fi

          version="${raw_version#openwrt-v}"
          version="${version#v}"
          tag_name="openwrt-v${version}"

          if [ -z "$version" ]; then
            echo "OpenWrt release version cannot be empty." >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$version" = "$raw_version" ]; then
            echo "Unable to determine OpenWrt release version from '$raw_version'." >&2
            exit 1
          fi

          if [ -z "$package_release" ]; then
            echo "package_release cannot be empty." >&2
            exit 1
          fi

          package_version="${version}-${package_release}"

          {
            echo "version=$version"
            echo "tag_name=$tag_name"
            echo "package_release=$package_release"
            echo "package_version=$package_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## OpenWrt Release"
            echo
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag_name\`"
            echo "- Package release: \`$package_release\`"
            echo "- Package version: \`$package_version\`"
            echo "- Prerelease: \`$prerelease\`"
          } >> "$GITHUB_STEP_SUMMARY"

  daemon:
    name: Build daemon (${{ matrix.target.name }})
    runs-on: ubuntu-22.04
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: aarch64
            rust_target: aarch64-unknown-linux-musl
            opkg_arch: aarch64_generic
          - name: x86_64
            rust_target: x86_64-unknown-linux-musl
            opkg_arch: x86_64
          - name: arm_cortex-a7
            rust_target: armv7-unknown-linux-musleabihf
            opkg_arch: arm_cortex-a7_neon-vfpv4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream tags
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream --tags

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            proxy-daemon/target
          key: ${{ runner.os }}-cargo-${{ matrix.target.rust_target }}-${{ hashFiles('proxy-daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target.rust_target }}-

      - name: Build cc-switch binary
        working-directory: proxy-daemon
        env:
          CCSWITCH_BUILD_VERSION: ${{ needs.prepare.outputs.package_version }}
          CCSWITCH_PRODUCT_VERSION: ${{ needs.prepare.outputs.version }}
        run: cross build --release --target ${{ matrix.target.rust_target }}

      - name: Build daemon IPK
        run: |
          set -euo pipefail
          openwrt/build-ipk.sh \
            --package daemon \
            --version "${{ needs.prepare.outputs.version }}" \
            --release "${{ needs.prepare.outputs.package_release }}" \
            --rust-target "${{ matrix.target.rust_target }}" \
            --opkg-arch "${{ matrix.target.opkg_arch }}" \
            --binary "proxy-daemon/target/${{ matrix.target.rust_target }}/release/cc-switch"

      - name: Upload daemon IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target.name }}
          path: openwrt/dist/cc-switch_*_${{ matrix.target.opkg_arch }}.ipk
          if-no-files-found: error

  luci:
    name: Build LuCI app
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream tags
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream --tags

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenWrt provider UI bundle
        env:
          OPENWRT_LUCI_APP_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: pnpm build:openwrt-provider-ui

      - name: Install po2lmo
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openwrt/luci.git /tmp/luci
          cd /tmp/luci/modules/luci-base/src
          make po2lmo
          sudo cp po2lmo /usr/local/bin/

      - name: Build LuCI IPK
        run: |
          set -euo pipefail
          CCSWITCH_IPK_SKIP_UI_REBUILD=1 openwrt/build-ipk.sh \
            --package luci \
            --version "${{ needs.prepare.outputs.version }}" \
            --release "${{ needs.prepare.outputs.package_release }}"

      - name: Upload LuCI IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci
          path: openwrt/dist/luci-app-cc-switch_*.ipk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    needs:
      - prepare
      - daemon
      - luci
    steps:
      - name: Download IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and summary
        working-directory: release-assets
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find . -maxdepth 1 -type f -name '*.ipk' -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No IPK files were downloaded." >&2
            exit 1
          fi

          sha256sum -- *.ipk > SHA256SUMS.txt
          cat SHA256SUMS.txt

          {
            echo "## OpenWrt Release Assets"
            echo
            echo "| File | SHA256 |"
            echo "| --- | --- |"
            while read -r sha file; do
              echo "| \`$file\` | \`$sha\` |"
            done < SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-release-assets-${{ needs.prepare.outputs.tag_name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: CC Switch OpenWrt ${{ needs.prepare.outputs.tag_name }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body: |
            ## CC Switch for OpenWrt

            Split OpenWrt packages for the CC Switch daemon and LuCI app.

            ### Install

            Download one daemon package for your router architecture plus the LuCI package:

            ```bash
            scp cc-switch_*_<arch>.ipk luci-app-cc-switch_*_all.ipk root@<router-ip>:/tmp/
            ssh root@<router-ip>
            opkg install /tmp/cc-switch_*_<arch>.ipk /tmp/luci-app-cc-switch_*_all.ipk
            ```

            ### Packages

            | Package | Target |
            |---|---|
            | `cc-switch_*_aarch64_generic.ipk` | ARM64 routers |
            | `cc-switch_*_x86_64.ipk` | x86_64 routers and VMs |
            | `cc-switch_*_arm_cortex-a7_neon-vfpv4.ipk` | ARM Cortex-A7 routers |
            | `luci-app-cc-switch_*_all.ipk` | LuCI web app |

            `SHA256SUMS.txt` contains checksums for all uploaded IPKs.
          files: |
            release-assets/*.ipk
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
